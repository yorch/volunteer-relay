</style></head><body><div id="app"></div><div id="toast" role="status"></div><script>
const initial=[{id:1,name:'Sofia Martinez',initials:'SM',time:'10:42 AM',channel:'Telegram',status:'Needs review',text:'Ana and I met with Mateo yesterday for an hour. He’s doing great with his reading! His family is out of diapers and needs some tonight.',excerpt:'Mentoring with Mateo + an urgent supply need',date:'Nov 6, 2026',urgent:true},{id:2,name:'James Wilson',initials:'JW',time:'10:18 AM',channel:'Web report',status:'Possible duplicate',text:'Helped at the Saturday supply drop with Carla. We were there from 9 to 11. Delivered six boxes to the community center.',excerpt:'Saturday supply drop · 2 hours',date:'Nov 7, 2026',duplicate:true},{id:3,name:'Lucia Perez',initials:'LP',time:'9:56 AM',channel:'Chat import',status:'Needs review',text:'Ayer ayudé a la familia Rivera con sus compras por una hora y media. Necesitan una laptop para las tareas de la escuela.',excerpt:'Family visit · school laptop needed',date:'Nov 6, 2026'},{id:4,name:'Ana Brooks',initials:'AB',time:'9:31 AM',channel:'Telegram',status:'Recorded',text:'Joined Sofia for Mateo’s mentoring session yesterday. One hour of reading practice. Sofia sent the family update already.',excerpt:'Mentoring session · linked to Sofia’s visit',date:'Nov 6, 2026',done:true}];
let messages=JSON.parse(localStorage.getItem('relayMessages')||'null')||initial;let needs=JSON.parse(localStorage.getItem('relayNeeds')||'null')||[{id:1,title:'Diapers needed this evening',family:'Mateo’s family',category:'Essential supplies',urgency:'Urgent',owner:'Unassigned',status:'New',note:'Reported by Sofia · awaiting staff verification',due:'Today, 5:00 PM'},{id:2,title:'Laptop for schoolwork',family:'Rivera family',category:'Education',urgency:'Normal',owner:'Marisol Vega',status:'Assigned',note:'Reported by Lucia · follow-up needed',due:'Monday, 12:00 PM'},{id:3,title:'Grocery delivery',family:'Chen family',category:'Essential supplies',urgency:'Normal',owner:'Owen Carter',status:'Acknowledged',note:'Owen is coordinating the delivery',due:'Today, 3:00 PM'}];let page='Inbox',selected=1,filter='All updates',query='',tab='staff';
function save(){localStorage.setItem('relayMessages',JSON.stringify(messages));localStorage.setItem('relayNeeds',JSON.stringify(needs))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){document.getElementById('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
const navs=[['Overview','◫'],['Inbox','▤'],['Needs','⚑'],['Activities','◷'],['Reports','▥']];function go(p){page=p;render()}function pending(){return messages.filter(m=>!m.done).length}function render(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">↗</span>volunteer relay<span style="color:#7a927a">.</span></div><div class="org"><span class="orgmark">≋</span><div><b style="font-size:11px">Tidepath Family Alliance</b><br><small style="font-size:10px">Miami-Dade, Florida</small></div></div><div class="overline">WORKSPACE</div><nav class="nav">${navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}${n==='Inbox'?`<span class="count">${pending()}</span>`:n==='Needs'?`<span class="count">${needs.filter(n=>n.status!=='Resolved').length}</span>`:''}</button>`).join('')}<button class="${page==='Volunteer'?'active':''}" onclick="go('Volunteer')"><span class="ico">♡</span>Volunteer view</button></nav><div class="bottom"><div class="demo"><b>A little clarity. More care.</b><br>Every update brings your community closer.</div><button class="btn" style="width:100%;margin-bottom:16px" onclick="resetDemo()">↻ Reset demo</button><div class="profile"><div class="avatar">OC</div><div><b style="font-size:12px">Owen Carter</b><br><small style="font-size:10px">Volunteer coordinator</small></div></div></div></aside><main class="main"><header class="topbar"><span>Tidepath <span style="margin:0 10px;color:#bac2b6">/</span> ${page}</span><div class="topactions"><span class="proto">DESIGN PROTOTYPE</span><span>Saturday, November 7</span><span class="avatar" style="width:27px;height:27px;font-size:10px">OC</span></div></header><div class="content">${page==='Volunteer'?volunteer():page==='Needs'?needsView():page==='Activities'?activities():page==='Reports'?reports():page==='Import'?importView():inbox()}</div></main></div>`}
function recordedHours(){return 24+messages.filter(m=>m.done&&m.id!==4&&!m.dismissed).reduce((sum,m)=>sum+parseInt(m.duration||'60')/60,0)}function stats(){return `<div class="stats"><div class="stat"><div class="statlabel">Updates to review <span>▤</span></div><div class="value">${pending()}</div><small>Let’s get everyone counted</small></div><div class="stat"><div class="statlabel">Urgent needs <span class="red">⚑</span></div><div class="value red">${needs.filter(n=>n.urgency==='Urgent'&&n.status!=='Resolved').length}</div><small class="red">Needs a helping hand today</small></div><div class="stat"><div class="statlabel">Volunteer hours <span>◷</span></div><div class="value">${(recordedHours()).toFixed(1)} <span style="font-size:13px;color:#8a958c;font-weight:400">hrs</span></div><small class="green">Verified contributions this week</small></div><div class="stat"><div class="statlabel">Visits this week <span>♡</span></div><div class="value">12</div><small>Small moments. Meaningful impact.</small></div></div>`}
function title(t,sub,action=''){return `<div class="heading"><div><h1>${t}</h1><p>${sub}</p></div>${action}</div>`}function inbox(){let m=messages.find(x=>x.id===selected)||messages[0];let visible=messages.filter(x=>(filter!=='Needs review'||!x.done)&&(filter!=='Urgent'||x.urgent)&&(!query||(x.name+' '+x.text).toLowerCase().includes(query.toLowerCase())));return title(page==='Overview'?'Good morning, Owen.':'Every update, connected.',page==='Overview'?'Here’s where your community needs you today.':'Turn everyday messages into recorded hours and a helping hand.',`<button class="btn" onclick="go('Import')">↥ Import updates</button>`)+stats()+`<div class="toolbar"><div class="tabs">${['All updates','Needs review','Urgent'].map(t=>`<button class="${filter===t?'selected':''}" onclick="filter='${t}';render()">${t}${t==='Needs review'?' · '+pending():''}</button>`).join('')}</div><input class="search" aria-label="Search updates" placeholder="⌕  Search updates…" value="${esc(query)}" onchange="query=this.value;render()"></div><div class="workspace"><div class="list"><div class="colhead">LATEST UPDATES <span>${visible.length} updates</span></div>${visible.map(x=>`<button class="message ${x.id===m.id?'chosen':''}" onclick="selected=${x.id};render()"><div class="row"><b>${esc(x.name)}</b><small style="font-size:9px">${x.time}</small></div><p>${esc(x.excerpt)}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge ${x.done?'ok':x.urgent?'urgent':''}">${x.done?esc(x.status):esc(x.status)}</span><span class="channel">${x.channel}</span></div></button>`).join('')||'<div class="empty">You’re all caught up.</div>'}</div><div class="conversation"><div class="personhead"><span class="avatar">${m.initials}</span><div><b style="font-size:12px">${esc(m.name)}</b><small>Mentoring volunteer · ${m.channel}</small></div><span style="margin-left:auto;color:#8a968b">•••</span></div><div class="thread"><div class="day">TODAY · ${m.time}</div><div class="bubble">${esc(m.text)}<span class="timestamp">${m.time} · Received ✓</span></div><div class="systemnote"><span>✧</span><span>Relay found ${m.urgent?'a mentoring visit and an urgent family need.':m.duplicate?'a visit that may already be recorded.':'an activity update.'}<br>Review the details before recording.</span></div><div class="reply"><label for="clarify" style="font-size:11px;display:block;margin-bottom:10px">Need a little more detail?</label><textarea id="clarify" placeholder="Write a clarification for ${esc(m.name.split(' ')[0])}…"></textarea><button class="btn" onclick="clarify()">Send clarification ↗</button><div class="hint" style="text-align:left;margin-top:8px">Demo only · no messages are sent</div></div></div></div><div class="review"><div class="colhead">PROPOSED RECORDS <span>✧ AI-assisted</span></div>${m.done?'<div class="reviewed">✓ Review complete.<br><small>The original message remains linked as evidence.</small></div>':`<div class="reviewbody"><section class="extracted"><header><span>◷ &nbsp; ${m.duplicate?'Supply delivery':'Mentoring visit'}</span><span class="green">${m.duplicate?'Check match':'Ready'}</span></header><div class="fields"><div class="field"><span>Date</span><b>${m.date}</b></div><div class="field"><span>Volunteer</span><b>${esc(m.name.split(' ')[0])}${m.id===1?' + Ana':''}</b></div><div class="field"><span>Duration each</span><select id="duration" aria-label="Duration" class="select" style="width:100px"><option>60 minutes</option><option>90 minutes</option><option>120 minutes</option></select></div><div class="field"><span>${m.id===1?'Contributions':'Status'}</span><b>${m.id===1?'2 × 60 min':'Pending review'}</b></div><div class="evidence">↳ Evidence: original message above</div>${m.duplicate?'<div class="badge" style="margin-top:12px">Possible match: Carla · Saturday delivery</div>':''}</div></section><section class="extracted needbox"><header><span>⚑ &nbsp; ${m.urgent?'Family need':'Follow-up'}</span><span class="badge ${m.urgent?'urgent':''}">${m.urgent?'Urgent':'Review'}</span></header><div class="fields"><b style="font-size:12px">${m.urgent?'Diapers needed tonight':m.id===3?'School laptop needed':'Verify visit details'}</b><p style="font-size:11px;color:#849080;margin:8px 0 13px">${m.urgent?'Provisional alert · family needs supplies today.':'Confirm details and assign the right person.'}</p><label for="assign" style="font-size:10px;color:#839080">Assign to</label><select id="assign" class="select" style="margin-top:6px"><option>Marisol Vega · Family support</option><option>Owen Carter · Coordinator</option></select><div class="evidence">↳ ${m.urgent?'“needs some tonight”':'Extracted from volunteer update'}</div></div></section></div><div class="reviewfoot"><button class="btn primary" onclick="approve(${m.id})">✓ ${m.duplicate?'Link visit & record contribution':'Approve & record'}</button><button class="btn" onclick="reject(${m.id})">Dismiss update</button><div class="hint">You’re in control. Nothing is recorded<br>until you approve it.</div></div>`}</div></div><div class="footerline"><span>✓ Original messages stay connected to every record.</span><span>Fictional data · local browser state · no live integrations</span></div>`}
function approve(id){let m=messages.find(x=>x.id===id);m.done=true;m.status='Recorded';m.duration=document.getElementById('duration')?.value||'60 minutes';if(m.urgent){let n=needs.find(x=>x.id===1);n.status='Assigned';n.owner=(document.getElementById('assign')?.value||'Marisol Vega').split(' · ')[0]}save();render();toast(m.id===1?'Visit recorded · 2 contributions · urgent need assigned':'Update recorded with source evidence')}
function reject(id){let m=messages.find(x=>x.id===id);m.done=true;m.dismissed=true;m.status='Dismissed';save();render();toast('Update dismissed from review')}function clarify(){let t=document.getElementById('clarify');if(!t.value.trim())return toast('Write a clarification first');toast('Clarification drafted · no external message sent');t.value=''}
function needsView(){return title('A helping hand, with a plan.','Every need has a next step. Make sure it has a person, too.')+`<div class="toolbar"><div class="badge urgent">${needs.filter(n=>n.urgency==='Urgent'&&n.status!=='Resolved').length} urgent · same-day follow-up</div><small>Click a card’s action to move it forward</small></div><div class="needsgrid">${['New','Assigned','Acknowledged'].map(s=>`<section class="lane"><h3>${s==='New'?'Needs an owner':s==='Assigned'?'Waiting for acknowledgment':'In progress'}<span>${needs.filter(n=>n.status===s).length}</span></h3>${needs.filter(n=>n.status===s).map(n=>`<article class="needcard"><span class="badge ${n.urgency==='Urgent'?'urgent':'ok'}">${n.urgency}</span><h3>${esc(n.title)}</h3><small>${esc(n.family)} · ${n.category}</small><p>${esc(n.note)}</p><span class="badge">Due ${n.due}</span><div class="owner"><span class="avatar" style="width:26px;height:26px;font-size:9px">${n.owner==='Unassigned'?'?':n.owner.split(' ').map(x=>x[0]).join('')}</span>${n.owner}</div><button class="btn ${s==='New'?'primary':''}" onclick="advance(${n.id})">${s==='New'?'Assign to Marisol':s==='Assigned'?'Acknowledge need':'Mark resolved'} →</button></article>`).join('')||'<div class="empty" style="font-size:12px;padding:25px">No needs here. A little breathing room.</div>'}</section>`).join('')}</div>${needs.some(n=>n.status==='Resolved')?'<p class="green">✓ '+needs.filter(n=>n.status==='Resolved').length+' need resolved. Your community is moving forward.</p>':''}`}
function advance(id){let n=needs.find(x=>x.id===id);if(n.status==='New'){n.status='Assigned';n.owner='Marisol Vega'}else if(n.status==='Assigned')n.status='Acknowledged';else n.status='Resolved';save();render();toast(n.title+' · '+n.status.toLowerCase())}
function volunteer(){return title('The volunteer experience','A quick update. A clearer picture for everyone.')+`<div class="phonewrap"><div class="phoneintro"><span class="badge ok">MOBILE-FIRST REPORTING</span><h2>Less paperwork.<br>More showing up.</h2><p>Volunteers can write the way they speak. Relay helps the team connect the details.</p><div class="steps"><div class="step"><b>1</b>Share what happened, in your own words</div><div class="step"><b>2</b>Add a photo or mention a family’s need</div><div class="step"><b>3</b>Your coordinator takes it from there</div></div></div><div class="phone"><div class="phonebar"><b>9:41</b><span>● ▰</span></div><div style="display:flex;align-items:center;gap:10px"><span class="logo" style="width:25px;height:28px;font-size:18px">↗</span><b style="font-size:12px">Tidepath Family Alliance</b></div><span class="badge ok" style="margin-top:26px">Hi, Sofia</span><h2>How did you help today?</h2><p>Tell us about your visit, your time, or anything the family needs.</p><textarea id="update" placeholder="I spent an hour with Mateo today. We practiced reading, and his family mentioned…"></textarea><label class="upload">＋ Add a photo<input type="file" accept="image/*" style="display:none" onchange="document.getElementById('filename').textContent=this.files[0]?.name||''"></label><small id="filename"></small><button class="btn primary" onclick="submitUpdate()">Send my update ↗</button><small>Your coordinator will review the details.<br>Only share what the team needs to know.</small></div></div>`}
function submitUpdate(){let t=document.getElementById('update').value.trim();if(!t)return toast('Add a few words about your update');let id=Date.now();messages.unshift({id,name:'Sofia Martinez',initials:'SM',time:'Just now',channel:'Web report',status:'Needs review',text:t,excerpt:t.slice(0,72),date:'Nov 7, 2026'});save();document.querySelector('.phone').innerHTML='<div style="padding:80px 10px;text-align:center"><div class="logo" style="margin:auto;width:60px;height:60px">✓</div><h2>Thanks for showing up.</h2><p>Your update is with your coordinator. The details are waiting for review.</p><span class="badge">Received · pending review</span><button class="btn primary" onclick="selected='+id+';go(\'Inbox\')">See it in the staff inbox →</button><button class="btn" style="margin-top:20px" onclick="render()">Send another update</button><small>Prototype: photo files are not uploaded.</small></div>';toast('Update received · ready for staff review')}
function activities(){let rows=messages.filter(m=>m.done&&!m.dismissed);return title('Every hour has a story.','Verified contributions, connected to the work behind them.')+`<table class="table"><thead><tr><th>Volunteer</th><th>Activity</th><th>Date</th><th>Contribution</th><th>Evidence</th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>Mentoring visit</td><td>${m.date}</td><td>${m.duration||'60 minutes'}</td><td><button class="btn" onclick="selected=${m.id};go('Inbox')">View source ↗</button></td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:11px">Prototype ledger · newly approved updates appear here. Shared visits keep separate volunteer contributions.</p>`}
function reports(){return title('The week, clearly counted.','A board-ready snapshot of the good your team is doing.',`<button class="btn" onclick="download()">↓ Export CSV</button>`)+stats()+`<div class="importbox" style="max-width:none"><h2>A record you can stand behind.</h2><p class="muted">November 2–8, 2026 · Tidepath Family Alliance</p><table class="table"><tr><td>Verified volunteer hours</td><td><b>${recordedHours()} hours</b></td></tr><tr><td>Unique visits</td><td><b>12 visits</b></td></tr><tr><td>Needs resolved</td><td><b>${needs.filter(n=>n.status==='Resolved').length}</b></td></tr><tr><td>Updates excluded pending review</td><td><span class="badge">${pending()} updates</span></td></tr></table><p style="font-size:11px;color:#859080">Design preview: summary values are illustrative. Pending updates remain visibly separate from verified totals.</p></div>`}
function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['metric,value\nillustrative_verified_hours,'+(recordedHours())+'\nillustrative_unique_visits,12\npending_updates,'+pending()+'\n'],{type:'text/csv'}));a.download='relay-demo-report.csv';a.click();toast('Demo CSV exported')}
function importView(){return title('Bring the conversation together.','Paste a fictional update to preview the import flow.')+`<div class="importbox"><h2>Import an update</h2><p class="muted">This prototype accepts one plain-text update. Full chat parsing belongs to the implementation.</p><label for="importtext">Volunteer message</label><textarea id="importtext" placeholder="Helped at the community center for two hours today…"></textarea><button class="btn primary" onclick="doImport()">Add to review inbox →</button></div>`}function doImport(){let t=document.getElementById('importtext').value.trim();if(!t)return toast('Paste a fictional message first');let id=Date.now();messages.unshift({id,name:'Imported volunteer',initials:'IV',time:'Just now',channel:'Chat import',status:'Needs review',text:t,excerpt:t.slice(0,72),date:'Nov 7, 2026'});selected=id;save();go('Inbox');toast('Update added to review inbox')}function resetDemo(){messages=structuredClone(initial);needs=[{id:1,title:'Diapers needed this evening',family:'Mateo’s family',category:'Essential supplies',urgency:'Urgent',owner:'Unassigned',status:'New',note:'Reported by Sofia · awaiting staff verification',due:'Today, 5:00 PM'},{id:2,title:'Laptop for schoolwork',family:'Rivera family',category:'Education',urgency:'Normal',owner:'Marisol Vega',status:'Assigned',note:'Reported by Lucia · follow-up needed',due:'Monday, 12:00 PM'},{id:3,title:'Grocery delivery',family:'Chen family',category:'Essential supplies',urgency:'Normal',owner:'Owen Carter',status:'Acknowledged',note:'Owen is coordinating the delivery',due:'Today, 3:00 PM'}];selected=1;save();go('Inbox');toast('Demo reset')};render();
</script></body></html>
