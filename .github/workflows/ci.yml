name: baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: node -e 'if(process.versions.node!=="26.11.1")process.exit(1)'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # Dashboard renderer unit tests drive a real headless Chromium.
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test
      - run: bun run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health
      - run: docker compose exec -T postgres psql -U relay -d relay -c 'select 1'
      - run: >-
          docker compose exec -T worker node --input-type=module -e
          'const {createDatabase}=await import("./packages/db/src/index.ts");
          const {db,close}=createDatabase(process.env.DATABASE_URL);
          try { await db.execute("select 1"); } finally { await close(); }'
      - run: docker compose exec -T worker node -e 'if(process.versions.node!=="26.11.1")process.exit(1)'
      - if: always()
        run: docker compose logs && docker compose down

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:e2e

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/relay_ci
      TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/relay_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: >-
          node --input-type=module -e
          'import {createDatabase} from "./packages/db/src/index.ts";
          const {db,close}=createDatabase(process.env.DATABASE_URL);
          try { await db.execute("CREATE DATABASE relay_ci_test"); } finally { await close(); }'
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run db:migrate && bun run db:seed
      - run: bun run test:integration
