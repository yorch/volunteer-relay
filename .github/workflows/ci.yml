name: baseline
on: [push, pull_request]
permissions:
  contents: read
# Only the newest push for a given branch or pull request builds: a newer run
# supersedes and cancels the in-flight one. Grouping by workflow + ref keeps
# unrelated branches, tags and PRs (refs/pull/<n>/merge) independent, so a run
# is never cancelled by traffic on another ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: node -e 'if(process.versions.node!=="26.11.1")process.exit(1)'
      - run: bun install --frozen-lockfile
      # The Justfile is optional for developers, but its checked-in recipes must
      # stay canonical. Pin the release and verify the published checksum
      # instead of trusting a mutable action or the runner image's binary.
      - name: Verify Justfile formatting
        shell: bash
        env:
          JUST_VERSION: 1.59.0
        run: |
          set -euo pipefail
          asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/casey/just/releases/download/${JUST_VERSION}"
          curl -fsSL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/${asset}" "${base}/${asset}"
          curl -fsSL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/SHA256SUMS" "${base}/SHA256SUMS"
          (cd "${RUNNER_TEMP}" && grep -F "  ${asset}" SHA256SUMS | sha256sum --check --strict)
          mkdir -p "${RUNNER_TEMP}/just"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/just" just
          "${RUNNER_TEMP}/just/just" --version
          "${RUNNER_TEMP}/just/just" --fmt --check
      - run: bun run check
      - run: bun run typecheck
      # External orchestration is a pinned development tool, never a product image dependency.
      - name: Install pinned Crewplane release
        shell: bash
        run: |
          set -euo pipefail
          version="v$(cat .crewplane-version)"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/yorch/crewplane/${version}/install.sh" -o "$RUNNER_TEMP/crewplane-install.sh"
          echo "36a4d111feb09e25cd5fd7e4046a3f1543cbbc78fe6df7bc58d6cdc7019be9f2  $RUNNER_TEMP/crewplane-install.sh" | sha256sum --check --strict
          CREWPLANE_VERSION="$version" CREWPLANE_INSTALL_DIR="$RUNNER_TEMP/crewplane" sh "$RUNNER_TEMP/crewplane-install.sh"
          echo "$RUNNER_TEMP/crewplane" >> "$GITHUB_PATH"
      - run: bun run test
      - run: bun run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health
      - run: docker compose exec -T postgres psql -U relay -d relay -c 'select 1'
      - run: >-
          docker compose exec -T worker node --input-type=module -e
          'const {createDatabase}=await import("./packages/db/src/index.ts");
          const {db,close}=createDatabase(process.env.DATABASE_URL);
          try { await db.execute("select 1"); } finally { await close(); }'
      - run: docker compose exec -T worker node -e 'if(process.versions.node!=="26.11.1")process.exit(1)'
      # Production slim-web smoke: the published image must serve as uid 1000
      # without dev sources. It joins the Compose network to reach postgres.
      - run: docker build -f infra/Dockerfile --target web -t relay-web:ci .
      - run: >-
          docker run -d --name relay-web-ci -p 127.0.0.1:3300:3000
          --network volunteer-relay_default
          -e DATABASE_URL=postgres://relay:relay@postgres:5432/relay
          -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          relay-web:ci
      - run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:3300/api/health
      - run: >-
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/dev/foundation)" = "404"
      - if: always()
        run: >-
          docker logs relay-web-ci || true; docker rm -f relay-web-ci >/dev/null 2>&1 || true;
          docker compose logs && docker compose down

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:e2e

  # Publishes ghcr.io/<owner>/<repo>-{web,worker} for linux/amd64 and
  # linux/arm64 on native runners, only after every gate passes on main or a
  # v* tag.
  publish:
    needs: [quality, compose, browser, postgres-integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        target: [web, worker]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: infra/Dockerfile
      target: ${{ matrix.target }}
      cache: true
      cache-scope: ${{ matrix.target }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/relay_ci
      TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/relay_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: >-
          node --input-type=module -e
          'import {createDatabase} from "./packages/db/src/index.ts";
          const {db,close}=createDatabase(process.env.DATABASE_URL);
          try { await db.execute("CREATE DATABASE relay_ci_test"); } finally { await close(); }'
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run test:product:integration
      # Auth HTTP suites against TEST_DATABASE_URL. local-http.test.ts serves a
      # real production build with its own `next start` (port 3186, SMTP aimed
      # at a closed local port), so the build runs here first.
      - run: bun run build
      - run: bun run test:http-auth:integration
