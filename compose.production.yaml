services:
  postgres:
    image: postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
  volume-init:
    image: postgres:18.1-bookworm
    user: "0:0"
    network_mode: none
    command:
      [
        "sh",
        "-c",
        "chown 1000:1000 /vol/attachments && chmod 700 /vol/attachments",
      ]
    volumes:
      - attachments:/vol/attachments
    restart: "no"
  migrate:
    image: ${RELAY_WORKER_IMAGE:?Set RELAY_WORKER_IMAGE}
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    command: ["node", "packages/db/src/migrate.ts"]
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  runtime-grants:
    image: postgres:18.1-bookworm
    user: "1000:1000"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      RELAY_RUNTIME_USER: ${RELAY_RUNTIME_USER:?Set RELAY_RUNTIME_USER}
      RELAY_RUNTIME_PASSWORD: ${RELAY_RUNTIME_PASSWORD:?Set RELAY_RUNTIME_PASSWORD}
    command:
      [
        "psql",
        "-X",
        "-q",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/setup/runtime-grants.sql",
      ]
    volumes:
      ["./infra/production/runtime-grants.sql:/setup/runtime-grants.sql:ro"]
    networks: [private]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"
  web:
    image: ${RELAY_WEB_IMAGE:?Set RELAY_WEB_IMAGE}
    env_file: ${RELAY_RUNTIME_ENV_FILE:?Set RELAY_RUNTIME_ENV_FILE}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["attachments:/data/attachments"]
    # egress: outbound internet for the app itself. traefik: the external
    # network the host reverse proxy watches, so it can reach this container.
    networks: [private, egress, traefik]
    # Routing is declared here and nowhere else. The host Traefik already owns
    # 80/443, TLS and certificate state, so this stack publishes no ports.
    # Compression is deliberately per-app rather than a host-global middleware:
    # the manifest then states everything about how this app is served, and a
    # change on the shared proxy cannot silently alter its responses.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME:-relay}.loadbalancer.server.port=3000"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.rule=Host(`${RELAY_DOMAIN:?Set RELAY_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.service=${TRAEFIK_NAME:-relay}"
      - "traefik.http.routers.${TRAEFIK_NAME:-relay}.middlewares=${TRAEFIK_NAME:-relay}-compress"
      - "traefik.http.middlewares.${TRAEFIK_NAME:-relay}-compress.compress=true"
    depends_on:
      runtime-grants: { condition: service_completed_successfully }
      volume-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
  worker:
    image: ${RELAY_WORKER_IMAGE:?Set RELAY_WORKER_IMAGE}
    env_file: ${RELAY_RUNTIME_ENV_FILE:?Set RELAY_RUNTIME_ENV_FILE}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["attachments:/data/attachments"]
    # No traefik: the worker never accepts inbound traffic and must stay off
    # the network shared with every other app on the host.
    networks: [private, egress]
    depends_on:
      runtime-grants: { condition: service_completed_successfully }
      volume-init: { condition: service_completed_successfully }
    stop_grace_period: 60s
  tools:
    image: postgres:18.1-bookworm
    profiles: [tools]
    user: "1000:1000"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["attachments:/data/attachments"]
    networks: [private]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: []
networks:
  # internal: no outbound path. Everything that touches the database lives here.
  private: { internal: true }
  # Bridged project network for outbound traffic (SMTP, provider APIs).
  egress: {}
  # Created on the host once: docker network create traefik
  traefik: { external: true }
volumes:
  postgres-data: {}
  attachments: {}
