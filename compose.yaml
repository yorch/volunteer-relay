name: volunteer-relay
services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["127.0.0.1:${RELAY_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      [
        "127.0.0.1:${RELAY_MAILPIT_UI_PORT:-8025}:8025",
        "127.0.0.1:${RELAY_SMTP_PORT:-1025}:1025",
      ]
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: dev
    # This is the local development topology. Production serving is a P7 task.
    command:
      [
        "node",
        "apps/web/node_modules/next/dist/bin/next",
        "dev",
        "apps/web",
        "--hostname",
        "0.0.0.0",
      ]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      NODE_ENV: development
    ports: ["127.0.0.1:${RELAY_WEB_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["attachments:/data/attachments"]
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      NODE_ENV: development
    volumes: ["attachments:/data/attachments"]
    depends_on:
      postgres:
        condition: service_healthy
  # Optional S3-compatible object storage for private attachments.
  # Start with: docker compose --profile s3 up -d objects, then set
  # BLOB_STORE=s3 and the S3_* variables on web/worker (.env.example).
  # versitygw (Apache-2.0) serves a POSIX volume: no cluster and no license
  # trap. MinIO Community Edition is archived upstream and is not used.
  objects:
    profiles: [s3]
    image: versity/versitygw:v1.10.0
    environment:
      ROOT_ACCESS_KEY: ${RELAY_OBJECTS_ACCESS_KEY:-relaylocal}
      ROOT_SECRET_KEY: ${RELAY_OBJECTS_SECRET_KEY:-relaylocaldevelopment}
    # A named volume is required: the POSIX backend keeps metadata in xattrs,
    # which a host bind mount on macOS or Windows does not support.
    command: ["--port", ":7070", "posix", "/data"]
    volumes: ["object-data:/data"]
    ports: ["127.0.0.1:${RELAY_OBJECTS_PORT:-7070}:7070"]
volumes:
  postgres-data:
  attachments:
  object-data:
