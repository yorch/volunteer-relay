---
# yamllint configuration for this repository.
#
# The default 80-column limit does not fit two things this repo legitimately
# contains: Traefik label lists (a single router rule is routinely >80 columns
# and cannot be wrapped without changing its value) and long one-line `run:`
# commands in CI. The committed style is therefore up to 120 columns, and flow
# mappings keep the single inner space they have always used:
#
#   postgres: { condition: service_healthy }
extends: default

rules:
  line-length:
    max: 120
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
